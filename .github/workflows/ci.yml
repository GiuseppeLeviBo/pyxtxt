name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Core-only install must import
        run: |
          python -m pip install .
          cd /tmp && python -c "import pyxtxt; print(pyxtxt.xtxt(b'core ok'))"
      - name: Install lightweight extras
        # audio and ocr (Whisper, EasyOCR) are skipped: they pull in PyTorch.
        run: python -m pip install ".[pdf,docx,presentation,spreadsheet,odf,html,markdown,epub,rtf,email,latex,outlook,ocr-ollama]" requests pytest
      - name: Run tests
        run: python -m pytest -q
